name: release
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write   # for PyPI trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is needed because the hatchling build hook (hatch_build.py) builds
      # the vendored bigraph-loom bundle (vivarium_workbench/loom/_dist) into the
      # wheel. VIVARIUM_WORKBENCH_REQUIRE_LOOM=1 (below) makes a missing bundle a
      # hard error on the publish path, so the shipped Explorer is never blank.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      # docs/backend-adapters.md step P4b: two distributions with identical versions and `==` pins both ways -- the
      # core (vivarium-workbench) and the viva-api backend plugin (vivarium-workbench-vivaapi,
      # packages/vivarium-workbench-vivaapi). Both are built and checked on every tag, but ONLY THE CORE is published
      # to PyPI (Jim, 2026-11-24): the plugin is not on PyPI. PyPI users get the SMS / viva-api features only from
      # git (README "Install"); the Stanford image installs the plugin from the same commit. uv does not check the
      # pins, so scripts/check_release.py does (the same checker as tests/test_lockstep_versions.py), against the
      # tag, before anything is built.
      - name: Lockstep guard (tag == both versions == both pins == uv.lock)
        run: python scripts/check_release.py "${GITHUB_REF_NAME#v}"
      # Into dist/core and dist/vivaapi (gitignored; the core sdist excludes /dist), never the repo root: the core
      # sdist would otherwise swallow the plugin's build output. check_wheels.py asserts it did not. The plugin is
      # built only to check it (packaging regressions fail here, not in the image build); it is not published.
      - name: Build both (loom bundle required)
        env:
          VIVARIUM_WORKBENCH_REQUIRE_LOOM: "1"
        run: |
          uv build --package vivarium-workbench-vivaapi -o dist/vivaapi
          uv build --package vivarium-workbench -o dist/core
          python scripts/check_wheels.py dist/core dist/vivaapi
      # The core only. Its [vivaapi] extra names vivarium-workbench-vivaapi, which is not on PyPI, so
      # `pip install 'vivarium-workbench[vivaapi]'` from PyPI does not resolve; the extra is for git installs and the
      # image. skip-existing makes a re-run idempotent.
      - name: Publish the core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core
          skip-existing: true
