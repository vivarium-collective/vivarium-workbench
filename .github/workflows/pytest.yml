name: pytest

# The full test suite as a PR gate.
#
# Until now CI ran `types.yml` only: mypy, import-linter, and FOUR named test
# files out of 285. The other ~98% of the suite never ran on a PR, so it rotted
# silently — switching it on surfaced 77 failures that predated any single
# change, including a companion-library API drift that had been broken for
# weeks and a feature that was inert in production.
#
# This gate runs everything except the tests listed in tests/known_failures.txt
# (see that file: the list is documented, justified, and meant to shrink). A
# second, non-blocking job runs exactly the quarantined set so that a test which
# starts passing becomes visible instead of sitting on the list forever.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR branch supersedes the running suite (each run is 8+ shard jobs). On `main` every push
# gets its own complete run: a cancelled main run would leave that commit without a `suite` / `core-only` result.
concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    # 4 shards x 4 cores each = ~16-way parallelism. Two levels, because each
    # alone leaves time on the table: a single job caps at the runner's 4 cores
    # (~6 min), while sharding without xdist wastes 3 of every 4 cores. Shards
    # are duration-balanced via .test_durations — see scripts/pytest_gate.sh.
    name: suite ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    strategy:
      # Run every shard even when one fails: a single red shard should still
      # tell you about failures in the other three, or you fix them one round
      # trip at a time.
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    timeout-minutes: 20
    # Same interpreter pin as types.yml (matches the image's Python 3.12).
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        # --frozen: install straight from uv.lock without re-resolving (the
        # non-frozen install is the `standalone` workflow's job).
        #
        # `test` (polars/pyarrow/zarr) is REQUIRED here, unlike in types.yml:
        # without it 11 tests fail rather than skip, because the parquet/zarr
        # readers are missing entirely.
        run: uv sync --frozen --extra dev --extra test --extra chat
      - name: pytest (shard ${{ matrix.group }}/4, quarantine deselected)
        # Serial single-job was ~14 min, xdist-only ~6 min. Sharding divides the
        # remaining test time by 4; the ~45s of checkout+sync is paid per shard
        # but runs concurrently, so it does not add to wall time.
        env:
          PYTEST_SPLITS: "4"
          PYTEST_GROUP: ${{ matrix.group }}
        run: uv run --frozen bash scripts/pytest_gate.sh

  suite-result:
    # Single stable check for branch protection to require. Without this you'd
    # have to require each `suite N/4` by name, and changing the shard count
    # would silently un-require the ones that no longer exist — the gate would
    # look configured while enforcing nothing.
    name: suite
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          if [[ "${{ needs.suite.result }}" != "success" ]]; then
            echo "::error::one or more test shards failed (${{ needs.suite.result }})"
            exit 1
          fi
          echo "all shards passed"

  quarantined:
    name: quarantine watch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking by design (continue-on-error): this job reports on the
    # known-failing set and must never red the `pytest` workflow, because a
    # check that is red on every PR by design teaches everyone to ignore red —
    # which would defeat the gate above. It surfaces two actionable cases in
    # its job summary instead: a quarantined test that starts PASSING (can be
    # deleted from tests/known_failures.txt), and a stale id (names a test that
    # no longer exists). pytest_gate.sh --only-known exits 1 on the stale case,
    # but continue-on-error keeps that out of the required-check rollup — note
    # its isolated collection can even mis-flag a still-present failing test as
    # stale, so the exit code is advisory, not a gate.
    continue-on-error: true
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen --extra dev --extra test --extra chat
      - name: pytest (quarantined only)
        run: uv run --frozen bash scripts/pytest_gate.sh --only-known

  core-only:
    # docs/backend-adapters.md step P3 (K1): the suite with the SMS plugin REMOVED, as the core ships without it (the
    # hosted env-worker pod, and step P4's split). Installed exactly like `suite`, then `vivarium_workbench_sms/` is
    # deleted from the checkout: the editable install's .pth lists the project root, so the package stops resolving.
    # tests/conftest.py then ignores the test modules that import the plugin at module level and strict-xfails the
    # tests marked `plugin` (a pass is a failure: the mark is stale). See tests/test_plugin_test_marking.py.
    #
    # BLOCKING since step P3 Z (K3): continue-on-error is gone, so a failing shard fails the `core-only` check below
    # (it is a required check on main: branch protection set 2026-11-23).
    name: core-only ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked, same as suite)
        run: uv sync --frozen --extra dev --extra test --extra chat
      - name: Remove the SMS plugin (the core ships without it)
        # The find_spec check fails the job loudly if the removal did not take (e.g. a non-editable install).
        run: |
          rm -rf vivarium_workbench_sms
          .venv/bin/python -c "import importlib.util, sys; spec = importlib.util.find_spec('vivarium_workbench_sms'); print('vivarium_workbench_sms ->', spec); sys.exit(spec is not None)"
      - name: The entry point outlives the package (so the job exercises the provider-absent path)
        # docs/backend-adapters.md step P4a: the installed metadata still names the `sms` provider; the registry must
        # skip it as absent, not report a broken plugin or a stale install.
        run: |
          .venv/bin/python -c "import importlib.metadata as m, sys; eps = m.entry_points(group='vivarium_workbench.backends'); print(list(eps)); sys.exit('sms' not in eps.names)"
      - name: Smoke (the app and the CLI start without the plugin)
        run: |
          set -euo pipefail
          .venv/bin/python -c "from vivarium_workbench.api.app import create_app; create_app()"
          help="$(.venv/bin/vivarium-workbench --help)"
          echo "$help"
          if ! grep -qE '^\s+serve\s' <<<"$help"; then
            echo "::error::vivarium-workbench --help does not list the core 'serve' subcommand"; exit 1
          fi
          if grep -q 'run-remote' <<<"$help"; then
            echo "::error::vivarium-workbench --help lists the plugin's 'run-remote' with the plugin removed"; exit 1
          fi
      - name: pytest (core only, shard ${{ matrix.group }}/4, quarantine deselected)
        # --no-sync: never rebuild the editable install -- hatch's `packages` names the removed directory.
        env:
          PYTEST_SPLITS: "4"
          PYTEST_GROUP: ${{ matrix.group }}
        run: uv run --frozen --no-sync bash scripts/pytest_gate.sh

  core-only-result:
    # The stable check name for branch protection (like `suite`). Until step P3 Z (K3) the shards ran with
    # continue-on-error, so this job read their real conclusions from the API (`needs.<job>.result` is `success` under
    # continue-on-error even when every shard failed); with continue-on-error gone it reads `needs` like `suite`.
    name: core-only
    needs: core-only
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check core-only shard results
        run: |
          if [[ "${{ needs.core-only.result }}" != "success" ]]; then
            echo "::error::one or more core-only shards failed (${{ needs.core-only.result }})"
            exit 1
          fi
          echo "all core-only shards passed"
