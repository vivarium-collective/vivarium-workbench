name: types

# Keeps the pydantic payload models honest: mypy on the typed modules + the
# model tests that validate real handler output against them. Scoped, fast gate;
# broader pytest CI can be added as a separate workflow later.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  types:
    runs-on: ubuntu-latest
    # Interpreter pinned to 3.12.12 to match the image's Python 3.12. The lock
    # itself is no longer 3.12.12-only (the v2ecoli demo environment that forced
    # that moved to demos/v2ecoli/); it resolves for >=3.11.
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        # --frozen: install straight from uv.lock without re-resolving. The
        # non-frozen install is the `standalone` workflow's job. Needs only `dev`.
        run: uv sync --frozen --extra dev --extra chat
      - name: ruff (F + E722 correctness gate, shipped packages)
        # Behaviour-only lint (pyflakes + bare-except): undefined names, unused
        # imports/vars, duplicate defs. Config in [tool.ruff.lint]. Scoped to the
        # shipped packages; the test tree is not yet under the gate.
        # `--with` layers a pinned ruff onto the frozen env without adding it to
        # uv.lock (re-locking this repo needs a sandbox worktree — avoided here).
        run: uv run --frozen --with "ruff==0.16.2" ruff check vivarium_workbench vivarium_dashboard
      - name: mypy (typed modules)
        run: uv run --frozen mypy
      - name: import-linter (ports & adapters layering)
        run: uv run --frozen lint-imports
      - name: Payload-model + generated-TS + API + lib tests
        run: uv run --frozen pytest tests/test_payload_models.py tests/test_generate_ts.py tests/test_api_app.py tests/test_investigation_status.py -q
