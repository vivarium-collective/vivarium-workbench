name: refresh test durations

# Regenerate .test_durations ON A CI RUNNER and open a PR with the result.
#
# Why this exists — a cautionary tale. .test_durations is load-bearing: the
# pytest gate (pytest.yml) splits its 4 shards by *duration*, not test count,
# reading this file (see scripts/pytest_gate.sh). When it goes stale, shard
# balance degrades and the slowest shard sets the wall-clock for the whole gate.
#
# The obvious fix — regenerate it locally and commit — makes things WORSE, not
# better. A laptop's per-test timings do not match GitHub's runners: a test that
# takes 30s on CI might hit a 120s timeout locally, so pytest-split mis-ranks it
# and misplaces the heavy tests. A locally-refreshed file measured a *wider*
# shard spread (347s) than the 3-month-stale one it replaced (241s). The timings
# must come from the same hardware that runs the gate — i.e. from here.
#
# So this workflow runs the full suite SERIALLY with --store-durations on an
# ubuntu-latest runner (the gate's own environment), then opens a PR with the
# refreshed file. The PR's own pytest gate then runs with the new durations, so
# the shard-balance improvement is visible in the PR's own checks before merge.
#
# Serial is intentional: --store-durations records wall-time per test, and xdist
# contention would pollute those numbers (pytest_gate.sh forces serial in this
# mode for exactly that reason).

on:
  schedule:
    # Mondays 06:00 UTC — a quiet window; the file drifts slowly, so weekly is
    # plenty to keep it from going months-stale as it did before.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Let a manual run supersede a scheduled one rather than queueing a second
# ~15-minute serial suite.
concurrency:
  group: test-durations-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: regenerate and open PR
    runs-on: ubuntu-latest
    # Serial full suite is ~14 min; headroom for a slow runner.
    timeout-minutes: 30
    permissions:
      # create-pull-request needs to push the branch and open the PR.
      contents: write
      pull-requests: write
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        # Same extras as the gate — `test` (polars/pyarrow/zarr) is required or
        # 11 tests fail instead of skip, which would skew the durations.
        run: uv sync --frozen --extra dev --extra test --extra chat
      - name: Regenerate .test_durations (serial, full suite)
        # pytest_gate.sh --store-durations runs the full gate suite (quarantine
        # deselected) serially with --store-durations --clean-durations, writing
        # a fresh, complete .test_durations. If a non-quarantined test is red on
        # main the suite fails here and no PR is opened — we only refresh off a
        # green main, which is the honest behavior.
        run: uv run --frozen bash scripts/pytest_gate.sh --store-durations
      - name: Open PR if durations changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: .test_durations
          branch: ci/test-durations-refresh
          delete-branch: true
          commit-message: "chore(ci): refresh .test_durations from CI runner timings"
          title: "chore(ci): refresh .test_durations (CI-measured)"
          body: |
            Automated refresh of `.test_durations`, measured on an `ubuntu-latest`
            runner — the same environment the pytest gate shards against.

            Generated by `.github/workflows/test-durations.yml`. This keeps shard
            balance accurate without the footgun of hand-regenerating the file
            locally (laptop timings mis-rank the CI-heavy tests and widen the
            shard spread rather than narrowing it).

            Review: the diff should be only `.test_durations`. Merging rebalances
            the 4 pytest shards toward their mean wall-clock.

            > Note: PRs opened by the Actions token don't auto-trigger the pytest
            > gate. Close+reopen this PR (or push an empty commit) to run the gate
            > with the new durations before merging.
