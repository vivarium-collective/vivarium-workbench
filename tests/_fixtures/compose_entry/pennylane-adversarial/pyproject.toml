[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-pennylane-adversarial"
version = "0.1.0"
description = "Process-bigraph wrapper for PennyLane adversarial attacks on QML classifiers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Alexander Patrie", email = "alexander@patrie.dev"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=1.5.0",
    "pennylane>=0.35",
    "torch>=2.0",
    "aiohttp",
    "fsspec",
    "h5py",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
    "polars",
    "scikit-learn>=1.3",
    "marimo[recommended]>=0.23.13",
]

[project.optional-dependencies]
# CI installs `.[dev]` (workspace-ci.yml) and runs `uv sync --extra dev`
# (publish-reports.yml); this extra supplies the test tooling it expects.
dev = ["pytest", "typer", "rich"]

[project.scripts]
adversarial = "app.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/pbg-pennylane-adversarial"
Issues = "https://github.com/anomalyco/pbg-pennylane-adversarial/issues"

# setuptools' editable install writes a ``top_level.txt`` into the dist-info,
# which ``importlib.metadata.packages_distributions()`` needs in order to map
# the ``pbg_pennylane_adversarial`` import package back to this distribution.
# bigraph-schema's ``allocate_core()`` package discovery relies on that mapping
# to find and register ``PennyLaneAdversarialProcess`` (via ``local:`` address).
# The previous hatchling backend produced a bare ``.pth`` editable install with
# no ``top_level.txt`` and no file records, so the process was never discovered
# and ``local:PennyLaneAdversarialProcess`` failed to resolve under ``-e``.
[tool.setuptools.packages.find]
include = ["pbg_pennylane_adversarial*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[dependency-groups]
cli = [
    "typer>=0.26.8",
]
