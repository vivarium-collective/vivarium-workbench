ignore_missing_imports = true
warn_unused_ignores = false
# api/app.py imports the (still-untyped) stdlib server module to reuse its
# HTTP-free payload builders. Don't descend into it (or its heavy transitive
# deps) — treat followed imports as Any so only models.py + app.py are checked.
follow_imports = "skip"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# `packages` already ships everything tracked under vivarium_dashboard/,
# including static/ and templates/. A force-include of those same paths added
# each data file a SECOND time, which hatchling rejects ("A second file is
# being added to the wheel archive at the same path: .../static/client.js") and
# broke every non-editable/wheel build (e.g. uv sync of the git dependency in
# Docker). They stay shipped via `packages`; no force-include needed.
# Ship the renamed package AND the thin vivarium_dashboard/ back-compat shim
# (deprecated; removed in Phase 3) so old imports keep resolving in wheels too.
packages = ["vivarium_workbench", "vivarium_dashboard"]
# vivarium_workbench/loom/_dist (the Vite build output of the vendored
# bigraph-loom, produced by `scripts/build_loom.sh` / `npm run build`) is
# gitignored — it's a generated artifact, not source. hatchling's default
# file selection excludes gitignored paths from `packages`, so it would be
# silently dropped from the wheel; `artifacts` opts it back in so
# vivarium_workbench.loom_assets.asset_dir() resolves in installed wheels too
# (mirrors how upstream bigraph-loom shipped bigraph_loom/_dist via `packages`
# — there it was git-tracked, so no artifacts entry was needed).
artifacts = ["vivarium_workbench/loom/_dist/**"]

# `artifacts` only opts _dist back IN to the wheel; nothing here ever BUILT it,
# so a wheel from a clean clone shipped the loom TS source and no bundle, and
# served a blank 404 Explorer. hatch_build.py runs scripts/build_loom.sh as part
# of the build: required for wheels (hard error), best-effort for editable
# installs so contributors without Node aren't blocked. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
timeout = 120
timeout_method = "signal"