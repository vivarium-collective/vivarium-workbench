[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivarium-workbench"
version = "0.3.49"
description = "Web-based workbench for Vivarium / process-bigraph workspaces"
authors = [{name = "Vivarium Collective", email = "team@vivarium-collective.org"}]
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "pyyaml",
    "jsonschema[format-nongpl]>=4.21",
    "pypdf>=4.0",
    "numpy",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Floor, not decoration: `lib/artifacts/hashing.py` re-exports
    # `process_bigraph.artifacts.artifact_id` instead of hand-porting it.
    # 1.7.0 is the release that narrows whole floats correctly, so `seed: 1`
    # and `seed: 1.0` are one address — an older pbg computes a DIFFERENT
    # address, which is a silent cache miss, so this floor must not slip.
    # `migrate-artifacts` also needs 1.7.0's `legacy_artifact_id`.
    "process-bigraph>=1.8.2",
    # SQLiteEmitter (and ParquetEmitter) were extracted from process-bigraph at
    # 1.4.17 into the focused emitters library; pb's `process_bigraph.emitter`
    # only re-exports SQLiteEmitter when the emitters lib is installed. The
    # dashboard imports SQLiteEmitter (lazily, in several run paths), so depend on
    # it directly. The `[sqlite]` extra is stdlib-only (no extra deps).
    #
    # Task 6 flipped the default emitter to xarray (see lib/emitters.py
    # DEFAULT_EMITTER), so its runtime deps are now MANDATORY, not test-only:
    # pull the `[xarray]` extra and pin xarray + zarr at the same specifiers the
    # `[test]` extra below uses (kept consistent).
    #
    # REBRAND: this was `pbg-emitters[sqlite,xarray]>=0.2.0`. The pbg-emitters
    # repo's `main` was renamed to the `viva-emitters` distribution — a git build
    # of the old URL now produces a package named `viva-emitters`, failing uv's
    # name check for a `pbg-emitters` requirement. viva-emitters 0.2.3 (PyPI)
    # ships the real `viva_emitters` package AND a `pbg_emitters` back-compat shim
    # whose meta-path finder redirects submodule imports like
    # `pbg_emitters.xarray_emitter` / `pbg_emitters.sqlite_emitter` to their
    # `viva_emitters.*` homes — so process-discovery's emitter import keeps working
    # and the dashboard's own `from pbg_emitters.sqlite_emitter import SQLiteEmitter`
    # path resolves. (The standalone `pbg-emitters` PyPI dist still exists at 0.2.1
    # and ships a colliding real `pbg_emitters` package; pinning viva-emitters here
    # keeps THIS project off it. See PR body for the still-transitive superpowers
    # pull and the one narrow `process_bigraph.emitter` re-export gap in the shim.)
    "viva-emitters[sqlite,xarray]>=0.2.3",
    "xarray>=2026.04",
    # Uncapped (>= not ~=): ~=3.1.6 excluded 3.2.x — a downgrade for py3.12+ vs
    # the prior version-split. The [test] extra below uses a bare `zarr`, so
    # >=3.1.6 keeps the runtime + test specifiers aligned (a floor, not a cap).
    "zarr>=3.1.6",
    "bigraph-schema>=1.4.3",
    # REBRAND: was `pbg-superpowers>=0.14.0`. The pbg-superpowers repo was renamed
    # to `viva-superpowers` (the git URL redirects; `main` now builds the
    # `viva-superpowers` distribution), and this package's own code imports
    # `viva_superpowers.*` (30+ call sites), so the declared dist must be
    # viva-superpowers. Crucially, viva-superpowers `main` migrated its emitter
    # dependency from `pbg-emitters` to `viva-emitters>=0.2.3` — so sourcing it
    # from `main` (below) is what keeps the stale standalone `pbg-emitters` out of
    # this package's own (non-demo) resolution. The PyPI release (0.22.0) still
    # predates that migration and would drag pbg-emitters back in, so it is NOT
    # used; declare BARE here + git `main` via [tool.uv.sources] (same
    # keep-URL-out-of-published-metadata pattern as the deps below). Bump to a
    # PyPI floor once viva-superpowers publishes a viva-emitters release.
    "viva-superpowers>=0.22.0",
    # viva-superpowers requires pbg-basic-processes, which is not yet on
    # PyPI. Declare it BARE here and supply the git URL via [tool.uv.sources]
    # below — NOT as an inline `pkg @ git+...` direct reference. A baked-in
    # branch URL becomes part of this package's published metadata, and uv
    # refuses to unify it with the bare `pbg-basic-processes` requirement coming
    # from viva-superpowers → "conflicting URLs" failures in any project that
    # depends on vivarium-dashboard transitively.
    "pbg-basic-processes",
    "investigation-contracts",
    # The ecosystem ledger. viva_superpowers.catalog.canonical_registry reads
    # viva_marketplace's topic-discovered modules.json when installed (single
    # source of truth for the Registry/Marketplace tab); without it the dashboard
    # falls back to pbg-superpowers' stale bundled copy. Not on PyPI → bare here,
    # git URL via [tool.uv.sources] below (same pattern as pbg-basic-processes).
    "viva-marketplace",
    # Shared workspace-layout source of truth (WorkspacePaths, find_workspace_root,
    # study_dir, canonical-run outcomes, package naming). vivarium-workbench's
    # lib/workspace_paths.py is now a thin shim re-exporting from here instead of
    # carrying its own duplicated copy. Dependency-light (stdlib + pyyaml), no AI
    # deps. Not on PyPI → bare here, git URL via [tool.uv.sources] below.
    "viva-workspace",
]

[project.optional-dependencies]
viz = ["matplotlib", "imageio", "numpy"]
# `vivarium-workbench render-loom` drives the loom in a headless browser to save
# each study's composite loom as a PNG. After installing, fetch the browser once:
#   python -m playwright install chromium
loom-render = ["playwright>=1.40"]
dev = ["pytest>=7.4", "pytest-timeout", "pytest-json-report>=1.5", "pytest-xdist>=3.5", "pytest-split>=0.9", "mypy>=1.8", "httpx>=0.27", "import-linter>=2.0"]
# Optional readers used only by parts of the test suite (parquet/zarr run
# stores). Without them those tests skip (via pytest.importorskip) rather than
# fail. Install with: uv pip install -e ".[dev,test]". See CONTRIBUTING.md.
# (zarr is needed alongside xarray for DataTree.to_zarr in the zarr tests.)
test = ["polars", "xarray", "zarr", "pyarrow"]
demo = ["v2ecoli", "pbg-ptools"]

[project.scripts]
# New canonical console scripts.
vivarium-workbench = "vivarium_workbench.cli:main"
vwb = "vivarium_workbench.cli:main"
vivarium-workbench-publish = "vivarium_workbench.publish:main"
# Back-compat aliases (deprecated; removed in Phase 3). Point at the new module.
vivarium-dashboard = "vivarium_workbench.cli:main"
vdash = "vivarium_workbench.cli:main"
vivarium-dashboard-publish = "vivarium_workbench.publish:main"

# DEMO-BRANCH ONLY: the `demo` extra pulls v2ecoli, which pins Python ==3.12.12
# exactly. The workbench package itself supports >=3.11, but a universal `uv lock`
# must then also solve the 3.11 slice, where v2ecoli is unsatisfiable → "no
# solution". Constrain lock resolution on this (combined-with-v2ecoli) branch to
# 3.12.12 — the version the demo image is built on — so `uv lock` /
# `uv sync --extra demo` resolve. This does NOT change the package's declared
# requires-python (>=3.11 for standalone use); it only scopes the lock.
[tool.uv]
environments = ["python_full_version == '3.12.12'"]

# Git source for the bare pbg-basic-processes dependency (not on PyPI). uv reads
# this when vivarium-dashboard is the root project; consumers that depend on it
# transitively supply the same URL via their own [tool.uv.sources]. This keeps
# the URL OUT of the published metadata so it never conflicts with the bare
# requirement from pbg-superpowers.
[tool.uv.sources]
# viva-superpowers: sourced from git (NOT PyPI 0.22.0) because only main has
# migrated off pbg-emitters onto viva-emitters>=0.2.3 — the whole point of this
# change. Pinned to a REV, not `branch = "main"`, matching the deliberate choice
# Track viva-superpowers `main` (branch, not a pinned rev). NOTE: a floating
# branch ref lets `uv lock` silently re-resolve to whatever main points at, so a
# breaking upstream change can land here with no commit in this repo (the failure
# mode that hid a break for ~3 weeks — issue #483). We accept that tradeoff here so
# this pin UNIFIES with the sibling process-packages (viva-copasi / viva-tellurium)
# that also track viva-superpowers@main — without a common form, uv refuses to
# resolve any consumer that pulls both (e.g. viva-human-atlas). If #483's silent-
# breakage risk resurfaces, the fix is to pin ALL of them (here + copasi/tellurium)
# to the same rev, not just this one. Drop the source + pin a PyPI floor once
# viva-superpowers ships a release that requires viva-emitters.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }
viva-marketplace = { git = "https://github.com/vivarium-collective/viva-marketplace.git", branch = "main" }
viva-workspace = { git = "https://github.com/vivarium-collective/viva-workspace.git", branch = "main" }
# investigation-contracts is declared bare in [project.dependencies] (kept out
# of published metadata) and is not on PyPI; supply its git URL here so `uv
# sync`/`uv lock` can resolve it (the editable-install gap that was failing CI).
# Pinned to a REV, not `branch = "main"`: a branch reference lets `uv lock`
# silently re-resolve to whatever main points at, so a breaking change upstream
# lands here with no commit in this repo (the exact failure mode that hid the
# pbg-superpowers _REGISTRY break for ~3 weeks — see issue #483). Bump this rev
# deliberately when adopting upstream changes. Equals the currently-locked rev,
# so this is a no-op resolve.
investigation-contracts = { git = "https://github.com/vivarium-collective/investigation-contracts.git", rev = "65c793fd231d952e49a9cfe4244797dadde1bedc" }
# v2ecoli is NOT a runtime dependency of the vivarium-workbench package — it is
# only needed for the demos/v2ecoli/ scripts. Declare it in [tool.uv.sources]
# so `uv sync --extra demo` resolves the local checkout. The bare `v2ecoli`
# requirement is listed in [project.optional-dependencies] → `demo`.
v2ecoli = { path = "../v2ecoli", editable = true }
# pbg-ptools is the Pathway Tools Omics-Viewer plugin (extracted from v2ecoli).
# LOCAL PATH source on purpose: pbg-ptools depends back on vivarium-workbench,
# and with a path source its own `../vivarium-workbench` resolves to the real
# sibling (== this root project), so uv unifies them — no "conflicting URLs".
# (A git source here would collide with the root, which is why `main` installs
# pbg-ptools via the Dockerfile instead.) This gives the local `--extra demo`
# dev env the PTools viewer, matching the deployed image.
pbg-ptools = { path = "../pbg-ptools", editable = true }


# bigraph-loom was previously a PEP 508 direct git URL (not on PyPI), which
# required [tool.hatch.metadata] allow-direct-references below. Task 8 vendored
# its source into vivarium_workbench/loom/ (built via `npm run build`, resolved
# at runtime through vivarium_workbench.loom_assets.asset_dir()), dropping the
# git dependency entirely. allow-direct-references is left enabled below since
# other direct-reference deps may be reintroduced; it is currently unused.

# ─── import-linter — the ports & adapters layering gate (REFACTOR-PLAN §2A.1) ──
# Keeps `lib.ports` a PURE interface layer: a port may never import a concrete
# adapter or the git/impl modules an adapter wraps. So the domain can depend on
# the interface without dragging in an implementation, and a cloud adapter swaps
# in without the port changing. Enforced in CI (`lint-imports`).
[tool.importlinter]
root_packages = ["vivarium_workbench", "viva_superpowers"]

[[tool.importlinter.contracts]]
name = "ports are pure interfaces (no adapter / no git-impl imports)"
type = "forbidden"
source_modules = ["vivarium_workbench.lib.ports"]
forbidden_modules = [
    "vivarium_workbench.lib.adapters",
    "vivarium_workbench.lib.git_status",
    "vivarium_workbench.lib.work_state",
    "vivarium_workbench.lib.git_commit_views",
]

[[tool.importlinter.contracts]]
# Phase 2.1/3: the workbench imports only a NARROW, DECLARED core of
# viva_superpowers (audit/eval spine + closure-blocked compute + ledger +
# bootstrap). Phase 2.1k moved all the borrowed investigation-science compute
# into vivarium_workbench/lib/, so this "forbidden" contract is the BELT that
# names the specific modules that must NEVER be imported from the plugin again.
# The SUSPENDERS — the positive allowlist that also catches any brand-new plugin
# import — is tests/test_plugin_import_allowlist.py (AST-scanned; ALLOWED there
# is the authoritative core surface). Keep the two in sync: a module added to
# ALLOWED must not appear below, and vice-versa.
#   - the Phase-1 substrate shims (moved to process_bigraph)
#   - vivarium_workbench.lib.viz_freshness — de-vendored in 2.1a; the workbench
#     must import viva_superpowers.viz_freshness directly, never re-vendor it.
#   - vivarium_workbench.lib.backfill_runs — deleted in 2.1a as dead code.
#   - the 12 compute modules moved into lib/ in 2.1k + the refresh_viz twin
#     (deleted from the plugin; the workbench owns lib/refresh_viz.py).
# NOTE: vivarium_workbench.lib.run_registry is intentionally NOT listed here.
# A.4 (de-vendor run_registry toward the plugin) is BLOCKED: the hard-gate
# byte-diff of RUNS_META_DDL found the plugin's copy has grown a
# `manifest_json TEXT` column this file's vendored block lacks. That module
# still exists and is legitimately imported within vivarium_workbench (see
# lib/run_registry.py's own docstring) pending its own DDL-drift fix.
name = "workbench must not import the Phase-1 shims or re-vendor de-vendored modules"
type = "forbidden"
source_modules = ["vivarium_workbench"]
forbidden_modules = [
  # Phase-1 shims (unchanged)
  "viva_superpowers.composite_generator",
  "viva_superpowers.composite_discovery",
  "viva_superpowers.visualization",
  "viva_superpowers.visualizations",
  # De-vendored in 2.1a — the workbench must NOT re-vendor these
  "vivarium_workbench.lib.viz_freshness",
  "vivarium_workbench.lib.backfill_runs",
  # Moved INTO the workbench in 2.1k batch 1 (lib/ now owns them) — the
  # workbench must import its own lib copy, never the plugin's (which is deleted).
  "viva_superpowers.study_verify",
  "viva_superpowers.study_narrative",
  "viva_superpowers.expert_search",
  "viva_superpowers.study_findings",
  # Moved INTO the workbench in 2.1k batch 2 (the needs_attention cluster).
  "viva_superpowers.needs_attention",
  "viva_superpowers.feedback_actions",
  "viva_superpowers.linkage_index",
  "viva_superpowers.param_enforcement",
  "viva_superpowers.readout_validation",
  # Moved INTO the workbench in 2.1k batch 3 (clean singletons).
  "viva_superpowers.auto_evaluate",
  "viva_superpowers.generation",
  # Moved INTO the workbench in 2.1k (citation_gaps; console-script dropped).
  "viva_superpowers.citation_gaps",
  # Dead twin deleted from the plugin in 2.1k — the workbench owns lib/refresh_viz.py.
  "viva_superpowers.refresh_viz",
]
# Direct imports only: viva_superpowers.study_audit (a real, staying module — see
# Phase 2.0 D3) internally uses composite_generator. That transitive edge is
# out of scope for this contract, which polices the workbench's OWN imports.
allow_indirect_imports = true

[tool.ruff]
# Focused correctness gate, not a formatter. `F` (pyflakes) catches the bugs
# that rot silently — undefined names, unused imports/variables, duplicate
# definitions — and `E722` bans bare `except:`. Style/formatting rules are
# deliberately NOT selected: this gate polices behaviour, not layout. The CI
# job (`.github/workflows/types.yml`) runs `ruff check` over the shipped
# packages (vivarium_workbench + the vivarium_dashboard shim); the test tree is
# not yet under the gate (it still carries benign unused-import noise — a
# follow-up can extend coverage there).
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E722"]

[tool.mypy]
python_version = "3.11"
# Incremental adoption: type-check only the new, fully-typed modules for now.
