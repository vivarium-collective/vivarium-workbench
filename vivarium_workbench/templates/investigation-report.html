  return `<figure><div class="fig-scroll">${sv}</div><figcaption>The process-bigraph Composite the agent built: ${procs.length} process${procs.length>1?'es':''}${stores.length?` wired over ${stores.length} shared stores`:''}, run through the engine.</figcaption></figure>`;
}

/* ---------- block renderers (spine) ---------- */
// dense tests / report-card table: description, machine criterion, provenance, final verdict + observed + margin
function testsTable(tests, traj){
  let finals={}, prov={};
  if(traj){
    if(traj.iterations&&traj.iterations.length)
      (traj.iterations[traj.iterations.length-1].tests||[]).forEach(t=>finals[t.id]={v:t.verdict,exp:t.expected,obs:t.observed,m:t.margin});
    (traj.tests||[]).forEach(t=>{prov[t.id]={exp:t.expected,provenance:t.provenance,label:t.label};});
  }
  const rows=(tests||[]).map(t=>{
    const name=t.name||t.id, desc=t.description||t.label||(prov[name]&&prov[name].label)||'';
    const meas=t.measure&&(t.measure.path||t.measure.observable||t.measure.kind);
    const cls=t.classification;
    const fin=finals[name]; const v=fin?(fin.v==='within_tol'?'pass':'fail'):null;
    const exp=(fin&&fin.exp)||(prov[name]&&prov[name].exp)||(t.pass_if&&(t.pass_if.op+' '+t.pass_if.value))||'';
    const pv=provText((prov[name]&&prov[name].provenance))||provText(t.pass_if&&t.pass_if.provenance)||(t.measure&&t.measure.kind==='audit-axis'?('audit axis '+meas):'');
    const obs=(fin&&fin.obs!=null)?`observed ${fmt(fin.obs)}`:'';
    const mg=(fin&&fin.m!=null)?` · margin ${fmt(fin.m)}`:'';
    return `<tr id="test-${esc(name)}"><td class="tname">${esc(desc||name)}
        <div class="texp mono">${esc(name)}${cls?' · '+esc(cls):''}${meas?' · '+esc(meas):''}</div>
        ${pv?`<div class="kv rationale" style="font-size:12px;margin-top:3px">${esc(pv)}</div>`:''}</td>
      <td class="tv"><div>${exp?`<span class="mono texp">${esc(exp)}</span>`:''} ${v?`<span class="chip ${v}" style="margin-left:6px">${v==='pass'?'✓ pass':'✗ fail'}</span>`:'<span class="chip">pending</span>'}</div>
        ${obs?`<div class="texp mono" style="margin-top:3px">${esc(obs)}${esc(mg)}</div>`:''}</td></tr>`;
  }).join('');
  return `<table class="ttable">${rows}</table>`;
}
function fmt(n){ if(typeof n!=='number') return esc(n); return Number.isInteger(n)?n:(Math.abs(n)<0.01?n.toExponential(1):n.toFixed(2)); }
// provenance may be a plain string OR an object ({kind, note, ...}); render a
// readable line, never a stringified object ("[object Object]").
function provText(p){ if(!p) return ''; if(typeof p==='string') return p;
  if(typeof p==='object') return String(p.note||p.rationale||p.kind||Object.values(p).filter(v=>typeof v==='string').join(' · ')||''); return String(p); }

function fbBubble(key,label){ return `<button class="fbbubble ${FB[key]?'has':''}" data-fb="${esc(key)}" data-fblabel="${esc(label)}" title="Add feedback to this section" aria-label="Add feedback to ${esc(label)}">💬</button>`; }
function part(label, body, key, klabel){ if(!body) return '';
  return `<div class="substage fbsection">${key?fbBubble(key,klabel||label):''}<div class="slabel">${label}</div>${body}</div>`; }

// Render a limitation / follow-up entry that may be a plain string OR a
// single-key {title: detail} map (the authored shapes in study.yaml).
function _debtText(x){
  if(x==null) return '';
  if(typeof x==='string') return mdLite(x);
  if(typeof x==='object'){
    const k=Object.keys(x);
    if(k.length===1) return `<b>${esc(k[0])}</b> — ${mdLite(String(x[k[0]]))}`;
    if(x.study||x.proposal||x.title) return `<b>${esc(x.study||x.title||'')}</b>${(x.proposal||x.rationale||x.reason)?' — '+mdLite(String(x.proposal||x.rationale||x.reason)):''}`;
    return esc(JSON.stringify(x));
  }
  return esc(String(x));
}

// traceability anchor built via the prefix helper (assembled, not a hardcoded
// href), so a finding's from_test resolves to its test-card anchor
function _traceLink(prefix, name){ return '<a class="trace-link" href="#' + prefix + '-' + esc(name) + '">' + esc(name) + '</a>'; }

// a copy-to-run command chip; '' for a falsy command (older payloads / static bundle)
function _runChip(cmd){ if (!cmd) return ''; return '<code class="run-chip" title="copy to run">' + esc(cmd) + '</code>'; }

// per-outcome rows separating the AUTHORED result from the COMPUTED/measured
// value (divergence badged), instead of a raw key:value dump
function outcomeRows(outcomes){
  return Object.entries(outcomes||{}).map(([k,o])=>{
    o=o||{}; const authored=o.result;
    const computed=(o.computed!=null?o.computed:o.measured_value);
    const diverge=(computed!=null && String(computed)!==String(authored));
    return `<div class="computed-outcome-row"><span class="mono" style="color:var(--ink-2)">${esc(k)}</span>
      <span class="outcome-chip-authored chip">authored: ${esc(authored)}</span>
      ${computed!=null?`<span class="outcome-chip-computed chip ${diverge?'reconcile-divergent':''}">computed: ${esc(computed)}</span>`:''}
      ${o.detail?`<span class="texp" style="margin-left:6px">${esc(o.detail)}</span>`:''}</div>`;
  }).join('');
}

// The four-part scientific unit — the PRIMARY structure of a study:
// question → model experiment → observable → what we learn. Each part no-ops
// when its field is absent, so a minimal study still renders cleanly.
function sciUnit(s){
  const q=s.question||(s.purpose&&s.purpose.question)||s.claim||'';
  const exp=_experimentOf(s);
  const obs=_observableOf(s);
  const learn=_whatWeLearn(s);
  const tier=(Array.isArray(s.findings)&&s.findings.length)?evidenceTier(s.findings[0],s):null;
  const row=(k,v,isQ,extra)=> v?`<div class="sci-part ${isQ?'q':''}"><div class="sp-k">${esc(k)}</div><div class="sp-v">${v}${extra||''}</div></div>`:'';
  const body=row('Scientific question', q?esc(q):'', true)
    + row('Model experiment', exp?mdLite(exp):'')
    + row('Observable', obs?`<span class="mono">${esc(obs)}</span>`:'')
    + row('What we learn', learn?mdLite(learn):'', false, tier?` ${etierBadge(tier)}`:'');
  return body?`<div class="sci-unit">${body}</div>`:'';
}

// "Methods · Simulations" node-card block — matches the locked SHARED spec used by
// the live workbench graph's study card (same rows + fidelity vocabulary + CSS
// class hooks), so the live graph and this published report read 1:1. Model / Sims
// / Tests render off the study's existing data now; the Methods row + fidelity chip
// populate from s.methods / s.fidelity (process-bigraph composite_generator
// methods=/fidelity=) once that field lands — until then they omit, data-safe.
function methodsSimsBlock(s){
  const comp=s.baseline_composite||'';
  const compName=comp?String(comp).split('.').pop():'';
  const methods=Array.isArray(s.methods)?s.methods.filter(Boolean):[];
  const fid=s.fidelity;
  const runs=Array.isArray(s.runs)?s.runs:[];
  const last=runs.length?runs[runs.length-1]:null;
  const rstatus=last?(last.status||s.simulation_status||''):(s.simulation_status||'');
  const nsteps=last?(last.n_steps||last.steps||''):'';
  const tc=s.tests_counts||{}; const pass=tc.passed||0, fail=tc.failed||0, skip=tc.skipped||0; const tot=pass+fail+skip;
  const rows=[];
  if(compName){
    const chip=fid?`<span class="aig-fidelity-chip aig-fidelity-${fid==='real'?'real':'repro'}">${fid==='real'?'real tool':'reproduction'}</span>`:'';
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Model</span><span class="aig-methods-val"><span class="mono">${esc(compName)}</span>${chip}</span></div>`);
  }
  if(methods.length)
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Methods</span><span class="aig-methods-val">${esc(methods.join(' · '))}</span></div>`);
  if(runs.length||rstatus||nsteps){
    const bits=[runs.length+' run'+(runs.length===1?'':'s')];
    if(rstatus) bits.push(esc(String(rstatus)));
    if(nsteps) bits.push(esc(String(nsteps))+' steps');
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Sims</span><span class="aig-methods-val">${bits.join(' · ')}</span></div>`);
  }
  if(tot){
    const glyphs=('✓'.repeat(Math.min(pass,16)))+(fail?('✗'.repeat(Math.min(fail,16))):'');
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Tests</span><span class="aig-methods-val${fail===0?' allpass':''}">${glyphs} ${pass}/${tot} passed</span></div>`);
  }
  return rows.length?`<div class="aig-methods-block"><div class="aig-methods-head">Methods · Simulations</div>${rows.join('')}</div>`:'';
}

// high-level overview shown when a study is COLLAPSED
function studySummary(s, inv){
  const chips=[];
  if(s.sourcing){
    chips.push(`<span class="chip decision">${esc(s.sourcing.decision)}</span>`);
    (s.sourcing.modules||[]).forEach(m=>chips.push(`<span class="chip mod">${esc(m)}</span>`));
    const ax=s.sourcing.audit&&s.sourcing.audit.axes;
    if(ax){ const ok=Object.values(ax).filter(v=>v==='within_tol').length; chips.push(`<span class="chip">audit ${ok}/${Object.keys(ax).length} axes</span>`); }
  } else {
    const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
    if(a) chips.push(`<span class="chip ${a.state==='DONE'?'pass':'fail'}">agent ${a.state==='DONE'?'✓ '+a.edits+'e':'✗'}</span>`);
    if(p) chips.push(`<span class="chip ${p.state==='DONE'?'pass':'fail'}">policy ${p.state==='DONE'?'✓':'✗ give-up'}</span>`);
    const it=s.agent_trajectory&&lastIt(s); if(it) chips.push(`<span class="chip">tests ${it.n_pass}/${it.n_hard}</span>`);
  }
  // evidence tier of the study's headline finding — so the collapsed card already
  // distinguishes an observed result from a hypothetical one.
  const tier=(Array.isArray(s.findings)&&s.findings.length)?evidenceTier(s.findings[0],s):null;
  const runN=(s.runs||[]).length; if(runN) chips.push(`<span class="chip">${runN} run${runN>1?'s':''}</span>`);
  const nfig=(s.figures_embedded||[]).filter(f=>f.data_uri||f.html).length; if(nfig) chips.push(`<span class="chip">${nfig} figure${nfig>1?'s':''}</span>`);
  const nfind=Array.isArray(s.findings)?s.findings.length:0; if(nfind) chips.push(`<span class="chip">${nfind} finding${nfind>1?'s':''}</span>`);
  if(tier) chips.push(etierBadge(tier));
  // the collapsed snippet is "what we learn" (claim / top finding), since the
  // scientific QUESTION is already the card's serif lead above.
  let learn=_whatWeLearn(s);
  const snip=String(learn).split(/(?<=[.!?])\s/).slice(0,2).join(' ');
  return `<div class="summary-chips">${chips.join('')}</div>${snip?`<div class="summary-snip"><span class="ek" style="color:var(--ink-3);font-weight:600">What we learn — </span>${esc(snip)}</div>`:''}`;
}

function renderStudy(s, inv, idx){
  const gate=gateOf(s), fail=gate==='fail', planned=gate==='planned', control=isControl(s), lo=loopOutcome(s);
  const dchip=fail?'fail':(planned?'planned':'pass');

  // LEAD WITH THE QUESTION — the scientific question is the study's headline,
  // before any model / implementation detail (falls back to purpose.question,
  // then the claim, so a question-less study still leads with something).
  const pq = s.purpose && s.purpose.question, pm = s.purpose && s.purpose.mechanism;
  const question = s.question || pq || s.claim;
  const claimLine = question? `<div class="claim">${esc(question)}</div>` : '';
  const bioText = s.biological_summary || pm;
  const overview = bioText?`<div class="biology">${esc(bioText)}</div>`:'';

  // MODEL — prefer a pre-rendered bigraph-loom image (offline-safe, config
  // loaded, from `vivarium-workbench render-loom`); else the live loom iframe;
  // else the re-drawn static topology / viz.
  const bl=(s.baseline||[])[0];
  const _mcid=(s.model_topology&&s.model_topology.composite)||(bl&&bl.composite)||'';
  const loomRendered = s.model_loom
    ? `<figure class="loom-embed"><div class="loom-frame" style="height:auto;max-height:640px;overflow:auto">
         <img src="${s.model_loom}" alt="bigraph-loom view of ${esc(_mcid)}" style="width:100%;display:block"/></div>
       <figcaption><b>bigraph-loom</b> view of <span class="mono">${esc(_mcid)}</span> — the composite's bigraph with its config loaded.</figcaption></figure>`
    : '';
  // The report is a self-contained document (often opened from disk / a static
  // bundle), so the Model section uses only renderings that need no network:
  // the pre-rendered bigraph-loom PNG (render-loom) when the composite has one,
  // else the static bigraph topology drawn from model_topology, then a plain viz.
  // (The live loom iframe and the re-drawn interactive-SVG loom were both removed:
  // the iframe failed offline, and the interactive SVG kept recurring in place of
  // a real loom figure.)
  let modelBody = loomRendered || (s.model_topology ? loomTopoSVG(s.model_topology) : '') || vizModelSVG(s,inv);
  if(s.sourcing){
    modelBody += `<div class="decision-line" style="margin-top:6px"><span class="chip decision">${esc(s.sourcing.decision)}</span>
      ${(s.sourcing.modules||[]).map(m=>`<span class="chip mod">${esc(m)}</span>`).join(' ')||'<span class="chip mod">new module</span>'}</div>
      ${s.sourcing.rationale?`<div class="kv rationale">${esc(s.sourcing.rationale)}</div>`:''}`;
  } else if(bl&&bl.composite){
    modelBody += `<div class="texp mono" style="margin-top:4px">${esc(bl.composite)}</div>`;
  }

  // SIMULATION RUN
  const runs=s.runs||[];
  let runBody = runs.length?runs.map(r=>{
    return `<div class="kv" style="margin:6px 0"><span class="chip ${r.status==='completed'?'pass':''}">${esc(r.status)}</span>
      <span class="mono" style="margin-left:8px;color:var(--ink-2)">${esc(r.name||r.module||'')}</span>
      ${outcomeRows(r.outcomes)}
      ${r.provenance?`<div class="texp mono" style="margin-top:2px">${esc(provText(r.provenance))}</div>`:''}</div>`;
  }).join(''):'';
  // run-command chips: how to reproduce this study + per-variant commands
  if(s.run_commands){
    const _base = s.run_commands && s.run_commands.baseline;
    if(_base) runBody += `<div class="reproduce-line texp" style="margin-top:6px">Reproduce: ${_runChip(_base)}</div>`;
    const _rcVariants = (s.run_commands && s.run_commands.variants) || [];
    _rcVariants.forEach(_vc=>{ runBody += `<div class="texp">${esc(_vc.name)}: ${_runChip(_vc && _vc.cmd)}</div>`; });
  }

  // VISUALIZATIONS (study figures + inlined images + audit axes)
  const figs=[];
  if(s.agent_trajectory) figs.push(['Margin ladder — LLM agent', vizMarginLadder(s.agent_trajectory)]);
  if(s.policy_trajectory) figs.push(['Margin ladder — deterministic policy control', vizMarginLadder(s.policy_trajectory)]);
  if(s.sourcing) figs.push(['Capability coverage', vizCapMatrix(s,inv)]);
  let figHtml=figs.filter(f=>f[1]).map(([t,svg])=>`<div style="margin:12px 0"><div class="kicker" style="margin-bottom:6px">${esc(t)}</div>${svg}</div>`).join('');
  // on-disk study visualizations, inlined by the generator: images as data
  // URIs, and `local:` live visualizations as their committed rendered HTML.
  (s.figures_embedded||[]).forEach(im=>{
    if(im.data_uri) figHtml+=`<figure><img src="${im.data_uri}" alt="${esc(im.name)}" loading="lazy"><figcaption>${esc(im.name)}</figcaption></figure>`;
    // Interactive figure (Plotly): the generator stripped its own Plotly loader
    // and handed us just the graph <div> + its Plotly.newPlot script. Render it
    // INLINE in the main document so it draws with the report's one shared
    // Plotly.js. The script stays inert until setupLazyPlotly() runs it the first
    // time the figure is actually laid out with a real width (see below) — so a
    // tab-hidden / collapsed figure is drawn at correct size when revealed, never
    // blank.
    else if(im.html && im.interactive) figHtml+=`<figure class="embedded-viz embedded-plotly" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><div class="plotly-holder">${im.html}</div></figure>`;
    // Any other committed HTML figure keeps the isolated-iframe path.
    else if(im.html) figHtml+=`<figure class="embedded-viz" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><iframe class="viz-frame" srcdoc="${esc(im.html)}" loading="lazy" onload="try{this.style.height=(this.contentWindow.document.documentElement.scrollHeight+8)+'px';}catch(e){}"></iframe></figure>`;
    else if(im.skipped) figHtml+=`<div class="texp" style="color:var(--ink-3)">↪ ${esc(im.name)} — ${esc(im.reason||'not inlined')}</div>`;
  });
  const auditHtml=(s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes)?`<div style="margin:10px 0"><div class="kicker" style="margin-bottom:6px">Audit — sourcing gate (4 axes)</div>${vizAuditAxes(s)}</div>`:'';
  const vizBody=(figHtml+auditHtml)||'';

  // TESTS (+ build reasoning for agentic)
  let testsBody = has(s.behavior_tests)?testsTable(s.behavior_tests, s.agent_trajectory):'';
  if(s.agent_trajectory){
    const at=s.agent_trajectory;
    testsBody += `<details class="exp"><summary>How the agent converged — iteration-by-iteration</summary><div class="body">${timelineSteps(at)}`;
    if(at.result&&has(at.result.violations)) testsBody+=`<div class="kv rationale" style="margin-top:8px;color:var(--warn)"><b>Integrity trail:</b> ${at.result.violations.map(esc).join('; ')}</div>`;
    if(s.policy_trajectory){const pr=s.policy_trajectory.result||{};
      testsBody+=`<div class="kv rationale" style="margin-top:8px"><b>Deterministic-policy control:</b> ${pr.state==='DONE'?`also DONE in ${pr.edits} edits`:`gave up after ${pr.edits} edit${pr.edits==1?'':'s'}`}.</div>`;}
    testsBody+=`</div></details>`;
  }

  // FINDINGS (with traceability: from_test anchored to its test card, the cited
  // pass_if band inlined, divergence surfaced, run_ids as plain code, seeded-study back-link)
  let findingsBody='';
  if(Array.isArray(s.findings) && s.findings.length){
    const bands={}, tcites={};
    (s.behavior_tests||[]).forEach(t=>{ const n=t.name||t.id; if(t.pass_if) bands[n]=t.pass_if; if(t.cites) tcites[n]=t.cites; });
    findingsBody=s.findings.map(f=>{
      const ok=(f.status==='passed'||f.status==='pass');
      const ft=f.evidence&&f.evidence.from_test, band=ft&&bands[ft];
      const runIds=(f.provenance&&f.provenance.run_ids)||[];
      const dv=f.divergence_factor;
      // Provenance: a finding's own cites (expected.cites) plus the cites on the
      // test it rests on — the literature the quantitative claim is measured against.
      const fcites=(f.expected&&f.expected.cites)||f.cites||[];
      const bandCites=(ft&&tcites[ft])||[];
      const allCites=[...new Set([...fcites,...bandCites])];
      const tier=evidenceTier(f,s);
      return `<div class="finding-traceability" style="margin:8px 0">
        <span class="chip ${ok?'pass':''}">${esc((f.id?f.id+' · ':'')+(f.status||'finding'))}</span>${tier?' '+etierBadge(tier):''}
        <div class="kv rationale">${esc(f.statement||'')}${allCites.length?' '+citeRow(allCites):''}</div>
        ${ft?`<div class="texp">from test: ${_traceLink('test',ft)}${band?` <span class="pass_if-band mono">${esc((band.op||'')+' '+(band.value!=null?band.value:''))}</span>`:''}${bandCites.length?' '+citeRow(bandCites,'band'):''}</div>`:''}
        ${dv!=null?`<div class="finding-divergence texp">divergence ${esc(dv)}× vs expected</div>`:''}
        ${runIds.length?`<div class="texp">runs: ${runIds.map(r=>`<code>${esc(r)}</code>`).join(' ')}</div>`:''}
        ${f.seeded_study?`<div class="finding-seeded texp">seeded study: ${_traceLink('s',f.seeded_study)}</div>`:''}</div>`;
    }).join('');
  }

  // DECISION  (conclusion, or a conclusion_logic block for pipeline-style studies)
  let conclusion=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!conclusion && s.conclusion_logic && s.conclusion_logic.if_primary_tests_pass){
    const cl=s.conclusion_logic.if_primary_tests_pass;
    conclusion=[cl.implementation_status, cl.biological_validation].filter(Boolean).join(' ');
  }
  // gate divergence: the code-computed gate verdict vs the authored gate_status
  let gateDiv='';
  const cg=s.computed_gate_verdict;
  if(cg){
    const code=cg.result||'', authored=s.gate_status||'';
    const same=(code===authored)||(code==='passing'&&authored==='passed')||(code==='failing'&&authored==='failed');
    if(cg.diverges_from_authored===true || (code && authored && !same))
      gateDiv=`<div class="sp-gate-divergence chip warn" style="margin-top:8px">⚠ gate divergence — code: ${esc(code)} · authored: ${esc(authored)}</div>`;
  }
  const decVerb=fail?'Gate refused':(planned?'Not yet run':'Gate cleared');
  const decisionBody=`<div class="decbox"><div>${statusChip(dchip)}</div>
    <div><div class="dverdict"><b>${decVerb}</b> · ${esc(s.confidence||'')}${lo?` · <span class="mono">${esc(lo.result)} (${esc(lo.detail||'')})</span>`:''}</div>
    ${conclusion?`<div class="dnarr">${mdLite(conclusion)}</div>`:''}${gateDiv}</div></div>`;

  // PROVENANCE — literature anchors (expectation → observable → source → status,
  // with citation chips linking to the References section) + key assumptions, so
  // every quantitative target traces back to the paper it came from.
  const anchors=s.literature_anchors||[];
  let anchorsBody='';
  if(anchors.length){
    const rows=anchors.map(a=>{
      const met=/\bmet\b/i.test(a.status_in_workspace||'');
      return `<tr><td class="ax-exp">${esc(a.expectation||'')}</td>
        <td class="ax-obs">${esc(a.model_observable||'')}</td>
        <td>${esc(a.source||'')}${citeRow(a.cites)}</td>
        <td class="ax-status ${met?'ax-met':''}">${esc(a.status_in_workspace||'')}</td></tr>`;
    }).join('');
    anchorsBody=`<table class="anchors"><thead><tr><th>Expectation (literature)</th><th>Model observable</th><th>Source</th><th>Status in workspace</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(has(s.key_assumptions)) anchorsBody+=`<div class="kicker" style="margin:14px 0 4px">Key assumptions</div><ul class="assumptions">${s.key_assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`;

  // LIMITATIONS & FOLLOW-UPS — the honest debts the study carries and what it
  // opens up next. Both were authored into study.yaml (limitations[],
  // discovery_implications{}) but never surfaced in the report before. Entries
  // may be plain strings or single-key {title: detail} maps (_debtText handles both).
  let debtsBody='';
  if(has(s.limitations)) debtsBody+=`<div class="kicker" style="margin:0 0 4px">Limitations</div><ul class="assumptions">${s.limitations.map(l=>`<li>${_debtText(l)}</li>`).join('')}</ul>`;
  const _di=s.discovery_implications;
  if(_di && typeof _di==='object'){
    const _addDi=(key,label)=>{ const v=_di[key]; if(Array.isArray(v)&&v.length) debtsBody+=`<div class="kicker" style="margin:12px 0 4px">${label}</div><ul class="assumptions">${v.map(x=>`<li>${_debtText(x)}</li>`).join('')}</ul>`; };
    _addDi('resolved_uncertainties','Resolved uncertainties');
    _addDi('new_uncertainties','New uncertainties');
    _addDi('open_questions','Open questions');
    _addDi('followup_study_proposals','Follow-up studies proposed');
  }

  // card badge uses the SAME status derivation as the graph + ladder (workbench
  // _studyStatusMeta), so a running study reads "Investigating" everywhere.
  const sm=studyStatusMeta(s);
  const wbChip=`<span class="status" style="color:${sm.color};background:color-mix(in srgb,${sm.color} 14%,transparent)"><span class="g" style="background:${sm.color}"></span>${esc(sm.label)}</span>`;
  return `<section class="card collapsed ${fail?'is-fail':''} ${planned?'is-planned':''} ${control?'is-control':''}" id="s-${s.slug}">
    <div class="card-h">
      <span class="ctoggle">▾</span>
      <span class="cnum">${String(idx).padStart(2,'0')}</span>
      <h3 class="ctitle">${esc(s.title)}</h3>
      <div class="cright">${control?'<span class="control-kick">⚑ Adversarial control</span>':''}${wbChip}</div>
    </div>
    ${claimLine}${overview}
    <div class="study-summary">${studySummary(s,inv)}</div>
    <div class="study-detail">
      ${sciUnit(s)}
      ${methodsSimsBlock(s)}
      ${part('Model — composite internals', modelBody, 'study:'+s.slug+'/model', s.title+' · Model')}
      ${part('Simulation run', runBody, 'study:'+s.slug+'/simulation', s.title+' · Simulation run')}
      ${part('Visualizations', vizBody, 'study:'+s.slug+'/visualizations', s.title+' · Visualizations')}
      ${part('Tests', testsBody, 'study:'+s.slug+'/tests', s.title+' · Tests')}
      ${part('Findings', findingsBody, 'study:'+s.slug+'/findings', s.title+' · Findings')}
      ${part('Provenance & anchors', anchorsBody, 'study:'+s.slug+'/provenance', s.title+' · Provenance')}
      ${part('Decision', decisionBody, 'study:'+s.slug+'/decision', s.title+' · Decision')}
      ${part('Limitations & follow-ups', debtsBody, 'study:'+s.slug+'/debts', s.title+' · Limitations')}
      ${feedbackRow('study:'+s.slug, 'this whole study')}
    </div>
  </section>`;
}

/* ---------- executive band ---------- */
// The report adapts to what the studies ACTUALLY are, rather than assuming an
// agent-vs-policy competition. Three modes:
//   sourcing  — studies carry a `sourcing` decision (model-sourcing investigations)
//   agentic   — studies carry an `agent_trajectory` (LLM-agent vs policy tasks)
//   generic   — everything else (a normal study: model · run · tests · decision)
function reportMode(inv){
  const ss=inv.studies||[];
  // 'sourcing' is for a sourcing-AUDIT investigation — one whose figure is the
  // reuse/compose/build-new decision map with an audit gate. Requires the actual
  // audit data (s.sourcing.audit), NOT merely a `sourcing.decision`: that is now
  // standard contract metadata on nearly every study, so keying off `s.sourcing`
  // alone mislabelled ordinary claim/agentic investigations as sourcing and
  // showed them an empty, trap-captioned decision map.
  if(ss.some(s=>s.agent_trajectory||s.policy_trajectory)) return 'agentic';
  if(ss.some(s=>s.sourcing&&s.sourcing.audit)) return 'sourcing';
  return 'generic';
}
// (The executive band was split: the scientific front matter now opens the
//  report — heroQuestion / abstractBlock / simulatedWorld / evidenceFraming /
//  renderArgument — and the verdict + stats + ladder moved BELOW it into
//  renderFindings(). reportMode() below still classifies the investigation.)
// The top-level hypothesis as cited claims: the origin-of-cells thesis broken
// into the statements the campaign tests, each with citation chips linking to
// the References section, plus the competing interpretive frameworks. So the
// investigation's headline reasoning traces to its sources, not just the studies.
function renderArgument(inv){
  const sa=inv.scientific_argument||{}; const kc=inv.key_claims||[];
  if(!sa.main_claim && !kc.length && !(sa.evidence_for||[]).length) return '';
  let claims='';
  if(kc.length){
    claims=kc.map(c=>{
      const counter=/contest|unfavorab|challenge|less favorab|may be far less/i.test(c.claim||'');
      return `<li class="${counter?'counter':''}"><span class="ctext">${esc(c.claim||c.text||'')}</span> ${citeRow(c.cites)}</li>`;
    }).join('');
  } else {
    claims=(sa.evidence_for||[]).map(e=>`<li><span class="ctext">${esc(e)}</span></li>`).join('')
      + (sa.evidence_against||[]).map(e=>`<li class="counter"><span class="ctext">${esc(e)}</span></li>`).join('');
  }
  const frames=(inv.competing_frameworks||[]).map(f=>
    `<span class="cframe">${esc(f.name||'')}${f.relation?`<span class="rel">${esc(f.relation)}</span>`:''}</span>`).join('');
  return `<div class="argument fbsection measure" id="hypothesis">${fbBubble('argument','The thesis & its evidence')}
    <div class="sec-h"><h2>The thesis &amp; its evidence</h2><span class="rule"></span></div>
    ${sa.main_claim?`<p class="main-claim">${mdLite(sa.main_claim)}</p>`:''}
    ${claims?`<ul class="claimlist">${claims}</ul>`:''}
    ${frames?`<div class="cframes">${frames}</div>`:''}
    ${has(sa.caveats)?`<details class="exp" style="margin-top:12px"><summary>Caveats</summary><div class="body"><ul style="margin:0;padding-left:18px">${sa.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></details>`:''}
  </div>`;
}
// dedicated place for the FINAL investigation-level visualizations
function renderInvViz(inv){
  const figs=[];
  const MODE=reportMode(inv);
  if(MODE==='sourcing'){ figs.push(['Sourcing decision map', vizDecisionMap(inv)]); }
  else if(MODE==='agentic'){ figs.push(['Agent vs policy — outcomes', vizOutcomeBar(inv)]); figs.push(['Final test outcomes', vizGateMatrix(inv)]); }
  else { figs.push(['Where the transitions are viable — passing vs failing regions', vizGateMatrix(inv)]); }
  const live=figs.filter(f=>f[1]); if(!live.length) return '';
  return `<div id="inv-viz" class="fbsection">${fbBubble('figures','Investigation visualizations')}<div class="sec-h"><h2>Investigation visualizations</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:0 0 6px">The investigation across all ${inv.studies.length} studies — passing and failing regions in one visual language.</p>
    ${live.map(([t,svg])=>`<div style="margin:20px 0"><div class="kicker" style="margin-bottom:8px">${esc(t)}</div>${svg}</div>`).join('')}</div>`;
}
function roleLine(s,inv){
  if(s.sourcing){ const mods=(s.sourcing.modules||[]).join(' + ')||'new module';
    return `${esc(s.sourcing.decision)} · <span class="mono">${esc(mods)}</span>`; }
  const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
  if(a||p){
    const av=a?(a.state==='DONE'?`agent ✓ ${a.edits}e`:'agent ✗'):'';
    const pv=p?(p.state==='DONE'?` · policy ✓`:` · policy ✗ give-up`):'';
    return av+pv;
  }
  // generic: the most informative available summary — test count + what it found
  const nt=(s.behavior_tests||[]).length;
  const c=s.verdict_counts||{}; const np=c.passed||0;
  let summary=s.claim||(s.findings&&s.findings[0]&&(s.findings[0].summary||s.findings[0].claim))||'';
  summary=String(summary).split('\n')[0].trim();
  const bits=[];
  if(nt) bits.push(`${np?np+'/':''}${nt} test${nt===1?'':'s'}${np?' pass':''}`);
  if(summary) bits.push(`<span style="color:var(--ink-2)">${esc(summary.length>90?summary.slice(0,88)+'…':summary)}</span>`);
  return bits.join(' · ')||'—';
}

/* ---------- computational architecture (appendix, demoted to the END) ----------
   The implementation inventory — reusable modules + declared capabilities — is
   the Process-Bigraph plumbing, not the scientific narrative. It lives in a
   clearly-labelled appendix at the end of the report, out of the main flow. */
function renderAppendix(inv){
  if(!inv.catalog) return '';
  const rows=Object.entries(inv.catalog).map(([m,caps])=>
    `<tr><td class="m">${esc(m)}</td><td>${caps.map(c=>`<span class="chip mod" style="margin:2px">${esc(c)}</span>`).join('')}</td></tr>`).join('');
  return `<div class="appendix fbsection" id="appendix">
    ${fbBubble('appendix','Computational architecture (appendix)')}
    <div class="sec-h"><h2>Appendix — computational architecture</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px">The reusable Process-Bigraph modules the studies are built from, and the capabilities each declares.</p>
    <table class="cat-table"><thead><tr><th>Module</th><th>Declared capabilities</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

/* ---------- references (provenance targets for the citation chips) ---------- */
function _collectCites(inv){
  // Count every bibkey used across the investigation so the References section
  // lists exactly the sources the studies rest on, most-cited first.
  const cnt={};
  const bump=ks=>(ks||[]).forEach(k=>{ if(k) cnt[k]=(cnt[k]||0)+1; });
  (inv.studies||[]).forEach(s=>{
    (s.literature_anchors||[]).forEach(a=>bump(a.cites));
    (s.behavior_tests||[]).forEach(t=>bump(t.cites));
    (s.findings||[]).forEach(f=>bump((f.expected&&f.expected.cites)||f.cites));
  });
  bump(inv.inv_references);
  return cnt;
}
function renderReferences(inv){
  const cnt=_collectCites(inv);
  const keys=Object.keys(cnt);
  if(!keys.length) return '';
  keys.sort((a,b)=>(cnt[b]-cnt[a])||((REFS[a]&&REFS[a].label||a).localeCompare(REFS[b]&&REFS[b].label||b)));
  const rows=keys.map(k=>{
    const r=REFS[k]||{};
    const label=r.label||k;
    // One compact line per reference: count · label · key — title · author, year · source.
    const bits=[r.title,[r.author,r.year].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
    const link=r.url?` · <a href="${esc(r.url.startsWith('http')?r.url:'https://doi.org/'+r.url)}" target="_blank" rel="noopener">source ↗</a>`:'';
    const n=cnt[k];
    return `<div class="refentry" id="ref-${esc(k)}"><span class="rcount">${n}×</span>`+
      `<b class="rt">${esc(label)}</b> <span class="rk">${esc(k)}</span>`+
      `${bits?` <span class="rmeta">— ${esc(bits)}</span>`:''}${link}</div>`;
  }).join('');
  return `<div class="appendix fbsection" id="references">
    ${fbBubble('references','References')}
    <div class="sec-h"><h2>References</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px;max-width:none">The papers behind each acceptance band, finding and literature anchor.</p>
    <div class="refs-list">${rows}</div>
  </div>`;
}

/* ---------- feedback ---------- */
let FB={}, CUR='model-sourcing';
function fbKeyStore(){ return 'viva-fb-'+CUR; }
function loadFB(){ try{ FB=JSON.parse(localStorage.getItem(fbKeyStore())||'{}'); }catch(e){ FB={}; } }
function saveFB(){ try{ localStorage.setItem(fbKeyStore(), JSON.stringify(FB)); }catch(e){} updateCount(); }
function setFB(key,patch){ FB[key]={...(FB[key]||{}),...patch};
  if(!FB[key].note && !FB[key].disp) delete FB[key]; saveFB(); }
function fbCount(){ return Object.keys(FB).length; }
function updateCount(){ const el=document.getElementById('fbcnt'); if(el) el.textContent=fbCount(); }
function feedbackRow(key,label){ const f=FB[key]||{};
  return `<div class="fbrow" data-fbkey="${esc(key)}">
    <span class="fblabel">Feedback · ${esc(label)}</span>
    <div class="fbdisp">
      <button data-disp="ok" class="${f.disp==='ok'?'on-ok':''}">👍 Looks right</button>
      <button data-disp="revise" class="${f.disp==='revise'?'on-rev':''}">✏️ Needs revision</button>
    </div>
    <input class="fbnote" placeholder="Add a note…" value="${esc(f.note||'')}"></div>`;
}
function yq(s){ return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ')+'"'; }
function genYaml(inv){
  const L=['feedback_report:','  investigation: '+inv.slug,'  title: '+yq(inv.title),
    '  reviewer: ""','  date: ""'];
  const emit=(k,ind)=>{ const f=FB[k]||{}; if(f.disp) L.push(ind+'disposition: '+f.disp); if(f.note) L.push(ind+'note: '+yq(f.note)); };
  if(FB['overall']){ L.push('  overall:'); emit('overall','    '); }
  const invSecs=Object.keys(FB).filter(k=>k!=='overall'&&!k.startsWith('study:'));
  if(invSecs.length){ L.push('  sections:'); invSecs.forEach(k=>{ L.push('    - section: '+k); emit(k,'      '); }); }
  const rows=inv.studies.filter(s=>Object.keys(FB).some(k=>k==='study:'+s.slug||k.startsWith('study:'+s.slug+'/')));
  if(rows.length){ L.push('  studies:');
    rows.forEach(s=>{ L.push('    - study: '+s.slug); L.push('      verdict: '+gateOf(s));
      if(FB['study:'+s.slug]) emit('study:'+s.slug,'      ');
      const secs=Object.keys(FB).filter(k=>k.startsWith('study:'+s.slug+'/'));
      if(secs.length){ L.push('      sections:'); secs.forEach(k=>{ L.push('        - section: '+k.split('/')[1]); emit(k,'          '); }); }
    });
  }
  if(!Object.keys(FB).length) L.push('  # (no notes yet — hover any section and click the 💬 to add feedback)');
  return L.join('\n')+'\n';
}

/* ---------- spine presentation: investigation graph (verdict-badged DAG) ---------- */
const VG={passed:['✅','passed'],failing:['⛔','failing'],blocked:['⚠','blocked'],
          needs_calibration:['🔄','needs calibration'],not_started:['◽','not evaluated']};
function _spineVerdictBadge(v){ const g=VG[v]||VG.not_started; return `<span class="spine-badge v-${v}">${g[0]} ${g[1]}</span>`; }
function _spineCountLabel(c){ if(!c) return ''; const p=[]; if(c.passed) p.push(c.passed+' passed'); if(c.skipped) p.push(c.skipped+' skipped'); if(c.failed) p.push(c.failed+' failed'); return p.join(' · '); }

// V8 — verdict-annotated study DAG (renders only when there are dependency edges;
// otherwise the at-a-glance table already conveys the flat list)
function _verdictDagHtml(sp){
  const dag=sp&&sp.verdict_dag; if(!dag||!dag.edges||!dag.edges.length) return '';
  const nodes=dag.nodes, edges=dag.edges;
  const byDepth={}; let maxD=0;
  nodes.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); if(n.depth>maxD)maxD=n.depth; });
  const colW=210, rowH=64, padL=8, padT=20, bw=180, bh=46;
  const maxRows=Math.max(...Object.values(byDepth).map(a=>a.length),1);
  const W=padL+(maxD+1)*colW, H=padT+maxRows*rowH+10;
  const pos={};
  Object.keys(byDepth).forEach(d=>{ byDepth[d].forEach((n,i)=>{ pos[n.slug]={x:padL+d*colW+bw/2, y:padT+i*rowH+bh/2}; }); });
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  edges.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    sv+=`<line x1="${a.x+bw/2}" y1="${a.y}" x2="${b.x-bw/2}" y2="${b.y}" stroke="var(--line-2)" marker-end="url(#dgar)"/>`; });
  nodes.forEach(n=>{ const p=pos[n.slug]; const g=VG[n.verdict]||VG.not_started;
    sv+=`<a href="#s-${n.slug}"><rect x="${p.x-bw/2}" y="${p.y-bh/2}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="var(--line-2)"/>`;
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y-4}" fill="var(--ink)" font-weight="600" font-size="12">${g[0]} ${esc(n.title.length>20?n.title.slice(0,19)+'…':n.title)}</text>`;
    const cl=_spineCountLabel(n.counts);
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y+13}" fill="var(--ink-3)" font-size="10.5">${g[1]}${cl?' · '+esc(cl):''}</text></a>`; });
  sv+=`<defs><marker id="dgar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
  const legend=Object.keys(VG).map(k=>`<span class="spine-legend-item">${VG[k][0]} ${VG[k][1]}</span>`).join('');
  return `<div class="study-verdict-dag"><div class="fig-scroll">${sv}</div>
    <div class="spine-legend">${legend}</div>
    <figcaption>Member studies as a dependency DAG (edges from <span class="mono">parent_studies</span>), each badged with its code-computed gate verdict.</figcaption></div>`;
}
function renderSpine(inv){
  // The graph REUSES the workbench's investigation-DAG rendering (ported), so the
  // report's graph matches the SPA the user drives. Acceptance-criteria gating
  // (the gating matrix + the authored acceptance-criteria list) was removed from
  // the report on request — the spine DATA is untouched, only this rendering.
  const graph=workbenchDag(inv);
  if(!graph) return '';
  return `<div id="spine-presentation" class="fbsection">${fbBubble('spine','Investigation graph')}
    <div class="sec-h"><h2>The investigation graph</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13.5px;margin:2px 0 8px">The campaign as a dependency graph — each study a node badged with its code-computed status, wired to the studies it builds on.</p>
    ${graph}</div>`;
}

/* ---------- interactive (Plotly) figures — LAZY, visibility-driven ----------
   Each interactive figure is inlined as its graph <div> + its Plotly.newPlot
   <script>, which is INERT until the figure first becomes visible. We must NOT
   render eagerly at load: a figure inside a collapsed study card (display:none)
   or below the fold has zero width, so Plotly.newPlot would lay it out at 0px →
   a blank box that a later resize can't reliably recover (seen in Safari when a
   figure is revealed by a subnav tab / card expand). Instead each figure is
   rendered the first time it is actually laid out with a real width — created at
   the correct size. Fully guarded: no Plotly bundle, or a malformed figure, is a
   silent no-op. */
function _isLaidOut(el){
  try{ const r=el.getBoundingClientRect(); return r.width>2 && r.height>2; }
  catch(e){ return false; }
}
function _resizeFig(fig){
  fig.querySelectorAll('.plotly-graph-div').forEach(d=>{ try{ Plotly.Plots.resize(d); }catch(e){} });
}
// Run a figure's inert <script>s (re-creating them so they actually execute),
// which calls Plotly.newPlot into the now-visible, real-width <div>. Idempotent:
// a figure is rendered at most once, then only resized.
function renderPlotlyFigure(fig){
  if(!fig || typeof Plotly==='undefined') return;
  if(fig.dataset.plRendered){ _resizeFig(fig); return; }
  if(!_isLaidOut(fig)) return;               // not visible yet — wait for a later trigger
  fig.dataset.plRendered='1';
  fig.querySelectorAll('script').forEach(old=>{
    try{
      const s=document.createElement('script');
      if(old.src) s.src=old.src; else s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    }catch(e){}
  });
  // one post-layout resize so the plot fills its container exactly
  try{ requestAnimationFrame(()=>_resizeFig(fig)); }catch(e){ _resizeFig(fig); }
}
function setupLazyPlotly(){
  if(typeof Plotly==='undefined') return;    // no shared bundle → leave figures inert
  const figs=[...document.querySelectorAll('figure.embedded-plotly')];
  if(!figs.length) return;
  // Sweep every figure: render the visible-and-unrendered ones, resize the rest.
  // This is the reliable path for a subnav-tab click / card expand / expand-all —
  // ANY reveal that changes layout — independent of scrolling.
  const sweep=()=>{ figs.forEach(f=>{ if(_isLaidOut(f)) renderPlotlyFigure(f); }); };
  // Primary: IntersectionObserver renders a figure as it scrolls into view (or
  // becomes visible when its card expands). rootMargin pre-renders slightly early.
  try{
    const io=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ renderPlotlyFigure(en.target);
        if(en.target.dataset.plRendered) io.unobserve(en.target); } });
    }, {root:null, rootMargin:'250px 0px', threshold:0.01});
    figs.forEach(f=>io.observe(f));
  }catch(e){}
  // Belt-and-suspenders for Safari file:// timing: any card class flip (collapse/
  // expand, subnav tab, expand-all) → sweep on the next frame.
  try{
    const mo=new MutationObserver(ms=>{ if(ms.some(m=>m.attributeName==='class')){
      try{ requestAnimationFrame(sweep); }catch(e){ sweep(); } } });
    document.querySelectorAll('.card').forEach(c=>mo.observe(c,{attributes:true,attributeFilter:['class']}));
  }catch(e){}
  // Subnav tab / index click expands + scrolls its target card; sweep just after.
  document.addEventListener('click', e=>{ try{ if(e.target.closest('.subnav a')||e.target.id==='expandall'){
    setTimeout(sweep,60); setTimeout(sweep,220); } }catch(err){} }, true);
  // Keep already-drawn figures crisp on viewport resize.
  window.addEventListener('resize', ()=>{ figs.forEach(f=>{ if(f.dataset.plRendered) _resizeFig(f); }); });
  // Anchored deep-link (opening the report at #s-<slug>): render after layout.
  try{ setTimeout(sweep,120); }catch(e){}
}

// Print / PDF preparation — called by the server-side PDF renderer (Playwright).
// Expands every study card and force-renders all lazy Plotly figures + looms so
// nothing is collapsed or blank in the static PDF, then resolves once they've had
// a few frames to draw. Safe no-op if called in a normal browser.
window.__reportPrintPrep = function(){
  return new Promise(resolve=>{
    // Expand EVERY study card and open all its detail sections, so the PDF shows
    // each study's FULL record (model, runs, figures, tests, findings, limitations),
    // not just the summary card. The downloadable PDF is the complete archive, so a
    // long document (one full study per section) is intended here; the interactive
    // HTML report keeps the cards collapsible. Expanding BEFORE the Plotly setup
    // below ensures figures inside the now-visible cards render + fit the page.
    try{ document.querySelectorAll('.card.collapsed').forEach(c=>c.classList.remove('collapsed')); }catch(e){}
    try{ document.querySelectorAll('details').forEach(d=>{ d.open=true; }); }catch(e){}
    try{ setupLazyPlotly(); }catch(e){}
    try{ document.querySelectorAll('figure.embedded-plotly').forEach(f=>{ try{ renderPlotlyFigure(f); }catch(e){} }); }catch(e){}
    // Re-fit every Plotly figure to its container (page) width. The saved figures
    // carry a fixed layout.width wider than an A4 page, so without this they spill
    // past the page edge and get clipped by the holder's overflow. relayout to the
    // holder width shrinks the whole (multi-panel) figure to fit, nothing cut off.
    try{
      if(window.Plotly && Plotly.relayout){
        // Fit each figure to its holder width. The PDF renderer uses an A4-width
        // viewport (see render_report_pdf), so the holder width measured here is
        // the real printed width — the saved figures carry a wider fixed layout
        // width, so without this they overflow the page and get clipped.
        document.querySelectorAll('figure.embedded-plotly .plotly-graph-div, figure.embedded-plotly .js-plotly-plot').forEach(gd=>{
          try{
            const holder=gd.closest('.plotly-holder')||gd.parentElement;
            const w=Math.max(220, ((holder&&holder.clientWidth)||680)-14);
            Plotly.relayout(gd,{width:w, autosize:false});
          }catch(e){}
        });
      }
    }catch(e){}
    // Rasterize WebGL Plotly figures to static PNGs for the PDF. 3D figures
    // (scatter3d / mesh3d / surface) and 2D-gl paint to a <canvas> that does NOT
    // reliably capture in the headless-Chromium print surface — so the MD
    // membrane / vesicle 3D plots came out blank. Plotly.toImage renders the GL
    // context to a data-URI we swap in as an <img>, which prints reliably. SVG
    // figures already print, so they're left interactive. Runs only in the PDF
    // path (__reportPrintPrep), so the HTML report keeps its live figures.
    function _rasterizePlotly(){
      const proms=[];
      try{
        if(!(window.Plotly && Plotly.toImage)) return proms;
        document.querySelectorAll('figure.embedded-plotly .plotly-graph-div, figure.embedded-plotly .js-plotly-plot').forEach(gd=>{
          try{
            if(!gd.querySelector('canvas')) return;   // SVG figure already prints
            const holder=gd.closest('.plotly-holder')||gd.parentElement;
            const w=Math.max(220, ((holder&&holder.clientWidth)||680)-14);
            const h=Math.max(220, gd.clientHeight||gd.offsetHeight||440);
            proms.push(Plotly.toImage(gd,{format:'png', width:w, height:h, scale:2}).then(function(uri){
              try{
                const img=document.createElement('img');
                img.src=uri; img.className='plotly-static';
                img.style.width='100%'; img.style.height='auto'; img.style.display='block';
                if(gd.parentNode) gd.parentNode.replaceChild(img, gd);
              }catch(e){}
            }).catch(function(){}));
          }catch(e){}
        });
      }catch(e){}
      return proms;
    }
    try{ setupInteractiveLooms(); }catch(e){}
    try{ setupRealLooms(); }catch(e){}
    // Investigation graph: lay it out TOP-TO-BOTTOM and scale to fit the page
    // width, so the PDF shows the whole DAG instead of a cut-off left-to-right
    // strip (the on-screen graph stays left-to-right + interactive).
    try{
      window.__dagPrint=true;   // keep the deferred relayouts from reverting to left-to-right
      const shell=document.querySelector('.wdag-shell'), canvas=document.getElementById('wdag-canvas');
      if(shell) shell.classList.add('dag-compact');   // lowest semantic zoom: title + status only
      if(window.__relayoutDag) window.__relayoutDag(true, true);   // vertical + compact
      if(shell&&canvas){
        const cw=parseFloat(canvas.style.width)||canvas.scrollWidth||1;
        const k=Math.min(1, 700/cw);   // 700px ≈ A4 content width at the PDF's margins
        // Use CSS `zoom` (not transform): it REFLOWS, so the scaled graph occupies
        // its true height and flows naturally ACROSS PAGES — the whole graph shows
        // at a larger, legible font instead of being squeezed onto one page.
        canvas.style.transform='';
        canvas.style.zoom=k;
        shell.style.overflow='visible';
        shell.style.maxHeight='none';   // the shell is capped at 620px on screen
        shell.style.height='auto';
        shell.style.breakInside=''; shell.style.pageBreakInside='';
      }
    }catch(e){}
    // Settle (figures + graph laid out), THEN rasterize WebGL figures and resolve
    // once every static snapshot has been swapped in.
    const _finish=()=>{ try{ Promise.all(_rasterizePlotly()).then(function(){setTimeout(resolve,500);}, function(){setTimeout(resolve,500);}); }catch(e){ setTimeout(resolve,700); } };
    let n=0; const tick=()=>{ if(++n<6){ try{requestAnimationFrame(tick);}catch(e){setTimeout(tick,16);} } else { _finish(); } };
    try{ requestAnimationFrame(tick); }catch(e){ _finish(); }
  });
};

/* ---------- interactive loom: hover / tooltip / expand / pan-zoom ---------- */
function _iloomHi(id,kind,name){
  const root=document.getElementById(id); if(!root) return;
  root.classList.add('il-active');
  root.querySelectorAll('.il-edge').forEach(e=>{
    const on = kind==='proc' ? e.getAttribute('data-p')===name : e.getAttribute('data-c')===name;
    e.classList.toggle('on',on); e.classList.toggle('off',!on);
  });
  const conn=new Set();
  root.querySelectorAll('.il-edge.on').forEach(e=>{ conn.add('p:'+e.getAttribute('data-p')); conn.add('c:'+e.getAttribute('data-c')); });
  root.querySelectorAll('.il-proc').forEach(g=>g.classList.toggle('dim', !conn.has('p:'+g.getAttribute('data-proc')) && !(kind==='proc'&&g.getAttribute('data-proc')===name)));
  root.querySelectorAll('.il-comp').forEach(g=>g.classList.toggle('dim', !conn.has('c:'+g.getAttribute('data-comp')) && !(kind==='comp'&&g.getAttribute('data-comp')===name)));
}
function _iloomClear(id){ const r=document.getElementById(id); if(!r) return;
  r.classList.remove('il-active');
  r.querySelectorAll('.on,.off,.dim').forEach(e=>e.classList.remove('on','off','dim'));
  const t=r.querySelector('.il-tip'); if(t) t.hidden=true; }
function _iloomTip(evt,id,text){ const r=document.getElementById(id); if(!r) return;
  const t=r.querySelector('.il-tip'); if(!t) return;
  t.textContent=text; t.hidden=false;
  const b=r.getBoundingClientRect();
  t.style.left=Math.min(b.width-12, evt.clientX-b.left+12)+'px';
  t.style.top=Math.max(4, evt.clientY-b.top-10)+'px'; }
function _iloomExpand(id,comp){ const r=document.getElementById(id); if(!r) return;
  let leaves={}; try{ leaves=JSON.parse(r.getAttribute('data-leaves')||'{}'); }catch(e){}
  let panel=r.querySelector('.il-stores');
  if(!panel){ panel=document.createElement('div'); panel.className='il-stores'; r.appendChild(panel); }
  const list=(leaves[comp]||[]);
  if(panel.dataset.comp===comp && !panel.hidden){ panel.hidden=true; panel.dataset.comp=''; return; }
  panel.dataset.comp=comp; panel.hidden=false;
  panel.innerHTML=`<b>cell/${comp}</b> — ${list.length} store${list.length==1?'':'s'}<div class="il-leaves">`+
    list.map(s=>`<span class="il-leaf">${esc(s)}</span>`).join('')+`</div>`;
}
function setupInteractiveLooms(){
  document.querySelectorAll('.iloom').forEach(root=>{
    const svg=root.querySelector('svg'), view=root.querySelector('.il-view'); if(!svg||!view) return;
    let z=1, tx=0, ty=0, drag=false, sx=0, sy=0;
    const apply=()=>view.setAttribute('transform',`translate(${tx},${ty}) scale(${z})`);
    svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const f=ev.deltaY<0?1.12:1/1.12;
      z=Math.max(0.3,Math.min(6,z*f)); apply(); },{passive:false});
    svg.addEventListener('mousedown',ev=>{ if(ev.target.closest('.il-comp'))return; drag=true; sx=ev.clientX-tx; sy=ev.clientY-ty; svg.classList.add('grabbing'); });
    window.addEventListener('mousemove',ev=>{ if(!drag)return; tx=ev.clientX-sx; ty=ev.clientY-sy; apply(); });
    window.addEventListener('mouseup',()=>{ drag=false; svg.classList.remove('grabbing'); });
  });
}
// Mount the embedded REAL loom(s) lazily (only one study section is visible at a
// time, so we don't boot React/ReactFlow for every study up front). The loom
// posts {type:'explore:ready'} once it mounts; if none arrives (a standalone
// download with no sibling loom bundle), swap in the static-topology fallback.
function setupRealLooms(){
  const frames=[...document.querySelectorAll('.loom-real')];
  if(!frames.length) return;
  const booted=new WeakSet();
  window.addEventListener('message',ev=>{
    const d=ev.data; if(!d||d.type!=='explore:ready') return;
    frames.forEach(f=>{ const ifr=f.querySelector('iframe');
      if(ifr&&ifr.contentWindow===ev.source){ booted.add(f); const b=f.querySelector('.loom-real-boot'); if(b) b.remove(); } });
  });
  const mount=f=>{
    if(f._mounted) return; f._mounted=true;
    const slot=f.querySelector('.loom-real-slot'), src=f.getAttribute('data-loomsrc'); if(!slot||!src) return;
    const ifr=document.createElement('iframe'); ifr.title='bigraph-loom'; ifr.setAttribute('loading','lazy'); ifr.src=src;
    slot.appendChild(ifr);
    setTimeout(()=>{ if(!booted.has(f)){ slot.hidden=true; const fb=f.querySelector('.loom-real-fallback'); if(fb) fb.hidden=false; } }, 8000);
  };
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ mount(e.target); io.unobserve(e.target); } });},{rootMargin:'250px'});
    frames.forEach(f=>io.observe(f));
  } else { frames.forEach(mount); }
}

/* ======================================================================
   WORKBENCH-CONSISTENT STATUS META (ported verbatim from walkthrough.js
   _STATUS_META / _studyStatusState so the report's graph + ladder badge a
   study with the SAME colour/icon/label the workbench SPA shows — never a
   second, divergent derivation). The COMPUTED gate_status verdict wins,
   then a definitive lifecycle, then the hand-set confidence.
   ====================================================================== */
const WSTATUS={
  Accepted:{color:'#16a34a',icon:'✓',label:'Accepted',k:'accepted'},
  Investigating:{color:'#ca8a04',icon:'◐',label:'Investigating',k:'investigating'},
  Planned:{color:'#2563eb',icon:'○',label:'Planned',k:'planned'},
  Blocked:{color:'#64748b',icon:'⊘',label:'Blocked',k:'blocked'},
  Refuted:{color:'#dc2626',icon:'✗',label:'Refuted',k:'refuted'},
};
function studyStatusState(s){
  s=s||{};
  const gate=String(s.gate_status||'').trim().toLowerCase();
  if(gate==='passed'||gate==='pass'||gate==='accepted') return 'Accepted';
  if(gate==='failed'||gate==='failed_evaluation'||gate==='refuted') return 'Refuted';
  if(gate==='blocked') return 'Blocked';
  if(gate==='partial'||gate==='needs_calibration'||gate==='in_progress') return 'Investigating';
  // Canonical execution_status (study_ontology) first — the same run-state the
  // live graph uses — then the report's legacy effective_status/status fallback.
  const life=String(s.execution_status||s.effective_status||s.status||'').trim().toLowerCase();
  if(life.indexOf('blocked')!==-1) return 'Blocked';
  if(life.indexOf('fail')!==-1||life==='invalid'||life==='refuted') return 'Refuted';
  const conf=String(s.confidence||'').trim();
  if(WSTATUS[conf]) return conf;
  if(['complete','completed','ran','passed','evaluated','decided'].indexOf(life)>=0) return 'Accepted';
  if(['running','analyzing','in_progress'].indexOf(life)>=0) return 'Investigating';
  return 'Planned';
}
function studyStatusMeta(s){ return WSTATUS[studyStatusState(s)]||WSTATUS.Planned; }
// dependency edges — same precedence as the workbench's _dagEdges: canonical
// pipeline_gate.prerequisites first, else the legacy parent_studies.
function dagEdges(s){
  const pg=s&&s.pipeline_gate;
  const raw=(pg&&pg.prerequisites&&pg.prerequisites.length)?pg.prerequisites:((s&&s.parent_studies)||[]);
  return (raw||[]).map(e=> typeof e==='string'
    ? {study:e,relation:'leads-to'}
    : (e&&e.study?{study:e.study,relation:e.relation||((e.outputs_used&&e.outputs_used.length)?'model-input':'leads-to'),outputs_used:e.outputs_used}:null)).filter(Boolean);
}
const DAG_REL={'leads-to':{color:'#94a3b8',dash:null,label:'leads to'},
  'model-input':{color:'#2563eb',dash:null,label:'model input'},
  'evidence':{color:'#0d9488',dash:'5 3',label:'evidence'},
  'calibrates-threshold':{color:'#ca8a04',dash:'2 3',label:'calibrates threshold'},
  'refutes-alternative':{color:'#dc2626',dash:'5 3',label:'refutes alternative'}};
function dagRelStyle(r){ return DAG_REL[r]||DAG_REL['leads-to']; }
// leading study-id chip ("og-02") + humanized rest, mirroring _humanizeStudyName.
function studyChip(slug){ const m=/^([a-z]+-\d+[a-z]*)-(.+)$/.exec(String(slug||'')); return m?m[1]:''; }

/* ---------- evidentiary-status tiers (Observed / Plausible / Hypothetical) ----------
   Distinguishes levels of scientific claim so a hypothetical bridging mechanism
   (e.g. a competing heredity module) never reads as established as measured
   chemistry. An explicit authored tier wins; otherwise it is derived from the
   finding's status and the study's maturity — a finding on a not-yet-accepted
   study is Hypothetical; on an accepted study, a confirmation of a known result
   is Observed and a new computational result is Plausible. Data-safe: returns
   null when there is nothing to tier. */
const ETIERS={
  observed:{k:'observed',label:'Observed',def:'reproduces a measured / established result'},
  plausible:{k:'plausible',label:'Plausible',def:'demonstrated feasible in the model under stated assumptions'},
  hypothetical:{k:'hypothetical',label:'Hypothetical',def:'a proposed mechanism, not yet established; competing alternatives'},
};
function evidenceTier(f,s){
  const raw=String((f&&(f.evidence_tier||f.tier||f.evidence_status))||'').toLowerCase();
  if(/observ|measur|empiric|establish/.test(raw)) return ETIERS.observed;
  if(/hypoth|specul|propos|candidate|alternativ|conject/.test(raw)) return ETIERS.hypothetical;
  if(/plausib|model|predict|feasib|demonstr/.test(raw)) return ETIERS.plausible;
  const accepted=studyStatusState(s)==='Accepted';
  if(!accepted) return ETIERS.hypothetical;
  const st=String((f&&f.status)||'').toLowerCase();
  if(st==='confirms'||st==='confirmed'||st==='passed'||st==='pass') return ETIERS.observed;
  return ETIERS.plausible;
}
function etierBadge(t){ if(!t) return ''; return `<span class="etier ${t.k}" title="${esc(t.def)}"><span class="d"></span>${esc(t.label)}</span>`; }
function etierLegend(){
  return `<div class="etier-legend">${Object.values(ETIERS).map(t=>
    `<span class="li">${etierBadge(t)}<span class="def">${esc(t.def)}</span></span>`).join('')}</div>`;
}

/* ---------- prose: split authored narrative into paragraphs via mdLite ---------- */
function proseHtml(text){
  if(text==null) return '';
  const parts=String(text).split(/\n\s*\n+/).map(p=>p.trim()).filter(Boolean);
  if(!parts.length) return '';
  return parts.map(p=>`<p>${mdLite(p)}</p>`).join('');
}

/* ====================== PUBLISHED-REPORT FRONT MATTER ====================== */
// The report OPENS like a paper: the scientific question first, an abstract,
// the simulated world (Background), what counts as evidence, then the thesis —
// before any verdict / dashboard. Each block degrades gracefully when its
// authored field is absent.
function heroQuestion(inv){
  const exv=inv.executive||{}, sa=inv.scientific_argument||{};
  const q=inv.question||exv.architecture_thesis||sa.main_claim;
  if(!q) return '';
  return `<div class="hero-q measure"><div class="qlabel">The question</div>
    <p class="qtext">${esc(q)}</p></div>`;
}
function abstractBlock(inv){
  const exv=inv.executive||{}, sa=inv.scientific_argument||{};
  // lead paragraph(s), then the thesis sentence (main_claim / what_is_this).
  const lead=inv.lead;
  const claim=sa.main_claim||exv.what_is_this;
  if(!lead && !claim) return '';
  let body='';
  if(lead) body+=proseHtml(lead);
  // only add the thesis sentence if it isn't already the lead's opening
  if(claim && (!lead || String(lead).slice(0,60)!==String(claim).slice(0,60)))
    body+=`<p class="main-claim">${mdLite(claim)}</p>`;
  return `<div class="abstract">${body}</div>`;
}
function simulatedWorld(inv){
  const exv=inv.executive||{};
  // Prefer the authored biological_story (the single biggest win — real prose).
  if(inv.biological_story){
    return `<div class="narr fbsection" id="background">${fbBubble('background','The simulated world')}
      <div class="sec-h"><h2>The simulated world</h2><span class="rule"></span></div>
      <div class="prose">${proseHtml(inv.biological_story)}</div></div>`;
  }
  // Graceful fallback: what_is_this + hypothesis as Background — only if present.
  const bits=[exv.what_is_this, inv.hypothesis].filter(Boolean);
  if(!bits.length) return '';
  return `<div class="narr fbsection" id="background">${fbBubble('background','Background')}
    <div class="sec-h"><h2>Background</h2><span class="rule"></span></div>
    <div class="prose">${bits.map(b=>`<p>${mdLite(b)}</p>`).join('')}</div></div>`;
}
function evidenceFraming(inv){
  // The evidentiary-tier legend — a real key for the tier chips on findings.
  // The former hardcoded "viability landscape" paragraph (origins-of-life
  // specific, no data input) was removed as boilerplate. Renders nothing when no
  // study carries findings, so a report without tiered evidence stays clean.
  const anyTier=(inv.studies||[]).some(s=>Array.isArray(s.findings)&&s.findings.length);
  if(!anyTier) return '';
  return `<div class="narr" id="evidence-basis">
    <div class="sec-h"><h2>What counts as evidence</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:2px 0 2px">Each study's findings and mechanisms carry an evidentiary tier:</p>${etierLegend()}
  </div>`;
}

/* ====================== PLAN LADDER (honest gate statuses) ====================== */
// The cumulative A→E gate ladder, computed exactly as the live investigation
// overview (met / qualified / refuted / off-spine branch). Leads the results so
// the reader sees where the campaign stands against its own plan before the
// detailed findings. Renders nothing when the investigation declares no plan_gates.
function planLadder(inv){
  const rows=(inv.spine&&inv.spine.plan_board)||[];
  if(!rows.length) return '';
  const meta={passed:['passed','#065f46','#d1fae5'],met:['met','#065f46','#d1fae5'],
    qualified:['qualified','#92400e','#fef3c7'],refuted:['refuted','#991b1b','#fee2e2'],
    in_progress:['in progress','#92400e','#fef3c7'],blocked:['blocked','#991b1b','#fee2e2'],
    pending:['pending','#475569','#f1f5f9']};
  const chips=rows.map(g=>{
    const m=meta[g.status]||meta.pending;
    const bits=[];
    const nm=(g.member_studies||[]).length; if(nm) bits.push(nm+' stud'+(nm===1?'y':'ies'));
    const np=(g.pending_studies||[]).length; if(np) bits.push(np+' planned');
    return `<div style="flex:1 1 160px;min-width:150px;border:1px solid var(--line);border-top:3px solid ${m[1]};border-radius:8px;padding:9px 11px;background:var(--surface)">
      <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
        <span class="mono" style="font-weight:800">${esc(String(g.id||''))}</span>
        <span style="font-size:13px;font-weight:600;color:var(--ink)">${esc(g.name||'')}</span>
        ${g.off_spine?`<span style="font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">branch</span>`:''}
        ${g.optional?`<span style="font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">optional</span>`:''}
      </div>
      <div style="display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 8px;border-radius:9999px;color:${m[1]};background:${m[2]}">${esc(m[0])}</div>
      ${bits.length?`<div style="font-size:11px;color:var(--ink-3);margin-top:5px">${esc(bits.join(' · '))}</div>`:''}
      ${g.criterion?`<div class="measure" style="font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.4">${esc(String(g.criterion).replace(/\s+/g,' ').trim())}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="narr" id="plan-ladder">
    <div class="sec-h"><h2>Where the campaign stands</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:2px 0 10px">The cumulative gate ladder — each gate's honest status, derived from its member studies' verdicts.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${chips}</div>
  </div>`;
}

/* ====================== AUTHORED NARRATIVE FIELDS (were dropped before) ====================== */
function _titleOf(inv,slug){ const s=(inv.studies||[]).find(x=>x.slug===slug); return s?s.title:slug; }

// "How to read" — evaluator orientation note (string prose or a list of tips).

      <div style="font-weight:600;color:var(--ink);font-size:13px">${esc(_titleOf(inv,slug))}</div>

// "Ground rules" — the campaign-wide architecture principles every study respects
// (guidelines.architecture_principles only; the rest of guidelines is internal

function groundRules(inv){

function decisionsBlock(inv){
